
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PaySmart</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>PaySmart</h1>
        <p>Smart, Simple and Secure Payments</p>
    </header>

    <main>
        <section class="welcome">
            <h2>Welcome to PaySmart</h2>
            <p>Manage your demo payments easily.</p>
        </section>

        <section class="dashboard">
            <div class="card">
                <h3>My Wallet</h3>
                <p id="wallet">₹0.00</p>
            </div>

            <div class="card">
                <h3>Total Expenses</h3>
                <p id="expenses">₹0.00</p>
            </div>
        </section>

        <section class="actions">
            <button onclick="openScanner()">Scan QR</button>
            <button onclick="addMoney()">Add Money</button>
            <button onclick="sendMoney()">Send Money</button>
            <button onclick="showTransactions()">Transactions</button>
            <button onclick="showExpenses()">Expense Tracker</button>
        </section>

        <section id="scannerSection" style="display:none;">
            <h2>QR Scanner</h2>
            <div id="reader"></div>
            <p id="scanResult">Scan a test QR code.</p>

            <h3>QR Scan History</h3>
            <div id="qrHistory">No QR scans yet.</div>

            <button onclick="stopScanner()">Close Scanner</button>
        </section>

        <section id="transactionSection">
            <h2>Transaction History</h2>
            <div id="transactionList">
                No transactions yet.
            </div>
        </section>

    </main>

    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="script.js?v=3"></script>

</body>
    </html>
