
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PaySmart</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>PaySmart</h1>
        <p>Smart, Simple and Secure Payments</p>
    </header>

    <main>
        <section class="welcome">
            <h2>Welcome to PaySmart</h2>
            <p>Manage your payments easily.</p>
        </section>

        <section class="dashboard">
            <div class="card">
                <h3>My Wallet</h3>
                <p>₹ 0.00</p>
            </div>

            <div class="card">
                <h3>Total Expenses</h3>
                <p>₹ 0.00</p>
            </div>
        </section>

        <section class="actions">
            <button>Scan QR</button>
            <button>Send Money</button>
            <button>Transactions</button>
            <button>Expense Tracker</button>
        </section>
    </main>

    <script src="script.js"></script>
</div>
    
<div id="scannerSection" style="display:none; text-align:center; padding:20px;">
    <h2>QR Scanner</h2>
    <div id="reader" style="width:100%;"></div>
    <p id="scanResult">Point your camera at a test QR code.</p>
    <button onclick="stopScanner()">Close Scanner</button>
</div>

</body>
</html>
